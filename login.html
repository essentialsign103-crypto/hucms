<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — HU CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#1E40AF"/>
          <path d="M20 8v24M8 20h24" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span><span style="color:#ef4444;font-weight:700;">HU</span> <span style="color:#1d4ed8;font-weight:700;">Clinic Management System</span></span>
      </div>

      <!-- Tabs -->
      <div style="display:flex;border-bottom:2px solid #e5e7eb;margin-bottom:20px;">
        <button id="tab-signin" onclick="switchTab('signin')" style="flex:1;padding:10px;border:none;background:none;font-weight:600;font-size:0.95rem;cursor:pointer;color:#1d4ed8;border-bottom:2px solid #1d4ed8;margin-bottom:-2px;">Sign In</button>
        <button id="tab-signup" onclick="switchTab('signup')" style="flex:1;padding:10px;border:none;background:none;font-weight:600;font-size:0.95rem;cursor:pointer;color:#9ca3af;border-bottom:2px solid transparent;margin-bottom:-2px;">Sign Up</button>
      </div>

      <!-- Sign In Form -->
      <div id="panel-signin">
        <h2 style="margin-bottom:4px">Welcome back</h2>
        <p class="login-sub">Sign in to your clinic dashboard</p>
        <form id="login-form">
          <div class="form-group">
            <label>Email address</label>
            <input type="email" id="login-email" class="form-control" placeholder="example@gmail.com" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <div style="position:relative">
              <input type="password" id="login-password" class="form-control" placeholder="••••••••" required style="padding-right:42px" />
              <button type="button" onclick="togglePassword('login-password','eye-icon-login')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:#6b7280;display:flex;align-items:center;">
                <svg id="eye-icon-login" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <div id="login-error" class="alert alert-danger hidden"></div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>
      </div>

      <!-- Sign Up Form -->
      <div id="panel-signup" style="display:none">
        <h2 style="margin-bottom:4px">Create account</h2>
        <p class="login-sub">Register as a new staff member. Admin accounts are created by the system administrator.</p>
        <form id="signup-form">
          <div class="form-group">
            <label>Full Name <span style="color:#ef4444">*</span></label>
            <input type="text" id="signup-name" class="form-control" placeholder="John Smith" required />
          </div>
          <div class="form-group">
            <label>Email address <span style="color:#ef4444">*</span></label>
            <input type="email" id="signup-email" class="form-control" placeholder="example@gmail.com" required />
          </div>
          <div class="form-group">
            <label>Role <span style="color:#ef4444">*</span></label>
            <select id="signup-role" class="form-control" required>
              <option value="doctor">Doctor</option>
              <option value="receptionist">Receptionist</option>
            </select>
          </div>
          <div class="form-group">
            <label>Password <span style="color:#ef4444">*</span></label>
            <div style="position:relative">
              <input type="password" id="signup-password" class="form-control" placeholder="Min. 6 characters" required style="padding-right:42px" />
              <button type="button" onclick="togglePassword('signup-password','eye-icon-signup')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:#6b7280;display:flex;align-items:center;">
                <svg id="eye-icon-signup" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <div id="signup-error" class="alert alert-danger hidden"></div>
          <button type="submit" class="btn btn-primary btn-full">Create Account &amp; Sign In</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login-page.js"></script>
  <script>
    function switchTab(tab) {
      const isSignin = tab === 'signin';
      document.getElementById('panel-signin').style.display = isSignin ? '' : 'none';
      document.getElementById('panel-signup').style.display = isSignin ? 'none' : '';
      document.getElementById('tab-signin').style.cssText = isSignin
        ? 'flex:1;padding:10px;border:none;background:none;font-weight:600;font-size:0.95rem;cursor:pointer;color:#1d4ed8;border-bottom:2px solid #1d4ed8;margin-bottom:-2px;'
        : 'flex:1;padding:10px;border:none;background:none;font-weight:600;font-size:0.95rem;cursor:pointer;color:#9ca3af;border-bottom:2px solid transparent;margin-bottom:-2px;';
      document.getElementById('tab-signup').style.cssText = isSignin
        ? 'flex:1;padding:10px;border:none;background:none;font-weight:600;font-size:0.95rem;cursor:pointer;color:#9ca3af;border-bottom:2px solid transparent;margin-bottom:-2px;'
        : 'flex:1;padding:10px;border:none;background:none;font-weight:600;font-size:0.95rem;cursor:pointer;color:#1d4ed8;border-bottom:2px solid #1d4ed8;margin-bottom:-2px;';
    }

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      const show  = input.type === 'password';
      input.type  = show ? 'text' : 'password';
      icon.innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }

    function toggleLoginPassword() { togglePassword('login-password', 'eye-icon-login'); }
  </script>
</body>
</html>
